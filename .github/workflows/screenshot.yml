name: Capture application screenshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshot.yml'
permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build desktop application
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDISKPILOT_BUILD_GUI=ON -DDISKPILOT_BUILD_TESTS=OFF
          cmake --build build --parallel 2
      - name: Capture real Qt application
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ./build/DiskPilot --capture-root "$GITHUB_WORKSPACE" --capture-screen diskpilot-dashboard.png
          file diskpilot-dashboard.png
      - name: Emit screenshot for repository import
        run: |
          echo 'DISKPILOT_SCREENSHOT_BASE64_BEGIN'
          base64 -w 0 diskpilot-dashboard.png | fold -w 8000
          echo 'DISKPILOT_SCREENSHOT_BASE64_END'
      - uses: actions/upload-artifact@v4
        with:
          name: DiskPilot-screenshot
          path: diskpilot-dashboard.png
          if-no-files-found: error

