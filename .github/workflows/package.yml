name: Build development packages (no release publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/package.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDISKPILOT_BUILD_GUI=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config build/CPackConfig.cmake -C Release -B packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem packages -Filter *.zip | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)" | Add-Content -Encoding ascii packages/SHA256SUMS.txt
          }
      - name: Verify extracted package binaries
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $archive = Get-ChildItem packages -Filter *.zip | Select-Object -First 1
          if (-not $archive) { throw 'No generated ZIP package' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath extracted
          $app = Get-ChildItem extracted -Recurse -File | Where-Object { $_.Name -eq $(if ($IsWindows) { 'DiskPilot.exe' } else { 'DiskPilot' }) } | Select-Object -First 1
          if (-not $app) { throw 'Desktop binary missing from archive' }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $bin = $app.Directory.FullName
          if (-not $IsWindows) {
            & chmod +x $app.FullName (Join-Path $bin 'diskpilot-cli')
          }
          & (Join-Path $bin "diskpilot-cli$suffix") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            # Check bundled Qt rather than finding the SDK through PATH.
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QML_IMPORT_PATH,Env:QML2_IMPORT_PATH,Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          }
          & $app.FullName --smoke-test
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: DiskPilot-development-${{ matrix.os }}
          path: |
            packages/*.zip
            packages/SHA256SUMS.txt
          if-no-files-found: error
