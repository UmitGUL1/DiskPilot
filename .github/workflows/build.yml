name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Qt-independent core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDISKPILOT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Measure a controlled 10000-file scan
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          cli = pathlib.Path('build/Release/diskpilot-cli.exe' if os.name == 'nt' else 'build/diskpilot-cli').resolve()
          with open('build/benchmark-10000.json', 'w', encoding='utf-8') as output:
              subprocess.run([sys.executable, 'tools/benchmark.py', '--cli', str(cli), '--files', '10000'], stdout=output, check=True)
      - name: Keep actual benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-10000-${{ matrix.os }}
          path: build/benchmark-10000.json
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure Qt Quick desktop
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDISKPILOT_BUILD_GUI=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Unit, CLI and GUI loading tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
