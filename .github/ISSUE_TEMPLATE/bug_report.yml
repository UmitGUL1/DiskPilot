name: Bug report
description: Report incorrect behavior or a reproducible crash.
body:
  - type: textarea
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: input
    attributes:
      label: OS, compiler and DiskPilot version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs and scan completeness
      description: Redact private paths. Do not upload personal files.
